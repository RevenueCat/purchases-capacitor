# A well-formed identifier missing from the dashboard passes without presenting a flow.
# The callback still contains customer info, with no obtained products or entitlements.

appId: com.revenuecat.automatedsdktests
name: Checkpoint unknown identifier passes without a flow

---
- clearState
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: checkpoint_unknown_identifier
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 30000
- assertVisible: "Callback: not invoked"
- tapOn:
    text: "Hit checkpoint"
- extendedWaitUntil:
    visible: "Callback: passed, no flow"
    timeout: 20000
- assertVisible: "Callback invocations: 1"
- assertVisible: "Obtained products: none"
- assertVisible: "Entitlement pro obtained: false"
- assertVisible: "Product pro_monthly_subscription obtained: false"
- assertVisible: "Customer active entitlements: none"
