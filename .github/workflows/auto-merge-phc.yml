name: Auto-merge PHC updates

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  approve:
    # Approves RCGitBot's PHC bump PRs so they satisfy the required review.
    # Auto-merge is armed by the bump lane, and RCGitBot can't approve its
    # own PR.
    if: |
      contains(github.event.pull_request.labels.*.name, 'pr:phc_dependencies') &&
      github.event.pull_request.user.login == 'RCGitBot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
