version: 2.1
orbs:
  macos: circleci/macos@2.3.6
  android: circleci/android@3.0.2
  node: circleci/node@5.1.0
  revenuecat: revenuecat/sdks-common-config@4.5.1

aliases:
  base-mac-job: &base-mac-job
    resource_class: m4pro.medium
    macos:
      xcode: '26.2.0'
    shell: /bin/bash --login -o pipefail

  release-tags: &release-tags
    filters:
      tags:
        ignore: /^.*-SNAPSHOT/
      branches:
        ignore: /.*/

  release-branches: &release-branches
    filters:
      tags:
        ignore: /.*/
      branches:
        only: /^release\/.*/

  only-main-branch: &only-main-branch
    filters:
      tags:
        ignore: /.*/
      branches:
        only: main

parameters:
  action:
    type: enum
    enum: [build, upgrade-hybrid-common, bump]
    default: build
  version:
    type: string
    default: ''
  automatic:
    type: boolean
    default: false

commands:
  install-nvm:
    steps:
      - node/install:
          install-yarn: true

  yarn-dependencies-unix:
    description: "Install yarn dependencies"
    steps:
      - install-nvm
      - restore_cache:
          key: v3-unix-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn install --frozen-lockfile
      - save_cache:
          paths:
            - node_modules
          key: v3-unix-dependencies-{{ checksum "yarn.lock" }}

  yarn-dependencies-mac:
    description: "Install yarn dependencies"
    steps:
      - install-nvm
      - restore_cache:
          key: v3-mac-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn install --frozen-lockfile
      - save_cache:
          paths:
            - node_modules
          key: v3-mac-dependencies-{{ checksum "yarn.lock" }}

  yarn-dependencies-ui-unix:
    description: "Install yarn dependencies for UI package"
    steps:
      - install-nvm
      - restore_cache:
          key: v4-unix-ui-dependencies-{{ checksum "purchases-capacitor-ui/yarn.lock" }}
      - run:
          name: Install UI package dependencies
          command: cd purchases-capacitor-ui && yarn install --frozen-lockfile
      - save_cache:
          paths:
            - purchases-capacitor-ui/node_modules
          key: v4-unix-ui-dependencies-{{ checksum "purchases-capacitor-ui/yarn.lock" }}

  yarn-dependencies-ui-mac:
    description: "Install yarn dependencies for UI package on Mac"
    steps:
      - install-nvm
      - restore_cache:
          key: v4-mac-ui-dependencies-{{ checksum "purchases-capacitor-ui/yarn.lock" }}
      - run:
          name: Install UI package dependencies
          command: cd purchases-capacitor-ui && yarn install --frozen-lockfile
      - save_cache:
          paths:
            - purchases-capacitor-ui/node_modules
          key: v4-mac-ui-dependencies-{{ checksum "purchases-capacitor-ui/yarn.lock" }}

  copy-npm-rc:
    steps:
      - run:
          name: Copy npmrc sample file to final location
          command: cp .npmrc.SAMPLE .npmrc

  copy-npm-rc-ui:
    steps:
      - run:
          name: Copy npmrc sample file to UI package location
          command: cp .npmrc.SAMPLE purchases-capacitor-ui/.npmrc

  override-android-agp-version:
    description: >
      Repoint the Maestro test app at a specific AGP/Gradle version, to verify the published plugin
      modules configure cleanly under it. Mutates the ephemeral checkout only.
    parameters:
      agp_version:
        type: string
      gradle_version:
        type: string
      extra_gradle_properties:
        type: string
        default: ""
    steps:
      - run:
          name: Override AGP << parameters.agp_version >> / Gradle << parameters.gradle_version >>
          command: |
            set -euo pipefail
            cd e2e-tests/MaestroTestApp/android

            # Gradle resolves a subproject's buildscript classpath parent-first, so overriding the
            # app's AGP also governs the embedded plugin modules, despite their own lower self-pin.
            # Matching any version (rather than a literal) keeps this from silently becoming a no-op
            # when the pinned AGP is bumped. `-i.bak` works on both GNU and BSD sed.
            sed -i.bak -E "s#(classpath ['\"]com\.android\.tools\.build:gradle:)[^'\"]+#\1<< parameters.agp_version >>#" build.gradle
            grep -q "com.android.tools.build:gradle:<< parameters.agp_version >>" build.gradle \
              || { echo "ERROR: AGP classpath line not found/replaced in build.gradle"; exit 1; }

            sed -i.bak -E "s#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-<< parameters.gradle_version >>-all.zip#" gradle/wrapper/gradle-wrapper.properties
            grep -q "gradle-<< parameters.gradle_version >>-all.zip" gradle/wrapper/gradle-wrapper.properties \
              || { echo "ERROR: distributionUrl not replaced in gradle-wrapper.properties"; exit 1; }

            # Set as Gradle properties rather than CLI args so build_maestro_test_app needs no changes.
            # @capacitor/android's own module still uses legacy-only DSL, so keep the new DSL off.
            printf '\nandroid.newDsl=false\n<< parameters.extra_gradle_properties >>\n' >> gradle.properties

            rm -f build.gradle.bak gradle/wrapper/gradle-wrapper.properties.bak
            echo "--- effective overrides ---"
            grep "com.android.tools.build:gradle" build.gradle
            grep "^distributionUrl" gradle/wrapper/gradle-wrapper.properties
            tail -3 gradle.properties


jobs:
  run-tests-ios:
    <<: *base-mac-job
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - yarn-dependencies-mac
      - run: yarn build
      - run: yarn verify:ios

  run-tests-android:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - yarn-dependencies-unix
      - run: yarn build
      - run: yarn verify:android

  verify-android-agp8:
    description: >
      Baseline: build the Maestro test app with the AGP version currently pinned by the repo.
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run:
          name: Build Maestro test app (Android, current pinned AGP)
          command: bundle exec fastlane build_maestro_test_app platform:android
          no_output_timeout: 15m

  verify-android-agp-override:
    description: >
      Build the Maestro test app against an overridden AGP/Gradle version, so the published plugin
      modules keep configuring cleanly on newer AGP (see issue #849).
    parameters:
      agp_version:
        type: string
      gradle_version:
        type: string
      extra_gradle_properties:
        type: string
        default: ""
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - override-android-agp-version:
          agp_version: << parameters.agp_version >>
          gradle_version: << parameters.gradle_version >>
          extra_gradle_properties: << parameters.extra_gradle_properties >>
      - run:
          name: Build Maestro test app (Android, AGP << parameters.agp_version >>)
          command: bundle exec fastlane build_maestro_test_app platform:android
          no_output_timeout: 15m

  build-purchase-tester:
    <<: *base-mac-job
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - yarn-dependencies-mac
      - run:
          name: Build purchase tester
          command: bundle exec fastlane build_purchase_tester

  run-api-tests:
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - yarn-dependencies-unix
      - run: yarn build
      - run:
          name: API Tests
          command: yarn apitest

  run-lint:
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - yarn-dependencies-unix
      - run: yarn build
      - run: yarn lint

  make-release:
    description: "Publishes the new version and creates a github release"
    <<: *base-mac-job
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - yarn-dependencies-mac
      - revenuecat/trust-github-key
      - copy-npm-rc
      - run:
          name: release
          command: bundle exec fastlane release

  run-maestro-e2e-tests-ios:
    <<: *base-mac-job
    macos:
      xcode: '26.4.1'
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - run:
          name: Start booting iOS Simulator
          command: xcrun simctl boot "iPhone 17" || true
      - yarn-dependencies-mac
      - yarn-dependencies-ui-mac
      - run:
          name: Replace Maestro test app API key
          command: bundle exec fastlane change_maestro_test_app_api_key
      - run:
          name: Build Maestro test app (iOS)
          command: bundle exec fastlane build_maestro_test_app platform:ios
          no_output_timeout: 15m
      - revenuecat/install-maestro
      - run:
          name: Wait for iOS Simulator boot to finish
          command: xcrun simctl bootstatus "iPhone 17" -b
      - run:
          name: Run Maestro E2E Tests (iOS)
          command: bundle exec fastlane run_maestro_e2e_tests_ios
          no_output_timeout: 15m
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

  run-maestro-e2e-tests-android:
    machine:
      image: android:2025.10.1
    resource_class: xlarge
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run:
          name: Replace Maestro test app API key
          command: bundle exec fastlane change_maestro_test_app_api_key
      - android/create_avd:
          avd_name: test-e2e
          system_image: system-images;android-34;google_apis;x86_64
          install: true
      - android/start_emulator:
          avd_name: test-e2e
          post_emulator_launch_assemble_command: bundle exec fastlane build_maestro_test_app platform:android
      - revenuecat/install-maestro
      - run:
          name: Run Maestro E2E Tests (Android)
          command: bundle exec fastlane run_maestro_e2e_tests_android
          no_output_timeout: 15m
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

  update-hybrid-common-versions:
    description: "Creates a PR updating purchases-hybrid-common to latest release"
    <<: *base-mac-job
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - install-nvm
      - revenuecat/trust-github-key
      - revenuecat/setup-git-credentials
      - run:
          name: Updating to next version of phc
          command: |
            bundle exec fastlane update_hybrid_common \
            version:<< pipeline.parameters.version >> \
            open_pr:true \
            automatic_release:<< pipeline.parameters.automatic >>

  # Note this is not using the orb's automatic-bump job since we need to install yarn to update docs here.
  bump:
    description: >
      Runs automatic bump
    docker:
      - image: cimg/ruby:3.2.0
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - revenuecat/trust-github-key
      - revenuecat/setup-git-credentials
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - yarn-dependencies-unix
      - run:
          name: Create automatic PR
          command: bundle exec fastlane automatic_bump github_rate_limit:10

  check-api-changes:
    description: "Check for unexpected API changes in purchases-capacitor and purchases-capacitor-ui"
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run: yarn build
      - run:
          name: Extract API (main package)
          command: yarn extract-api
      - run:
          name: Build UI package
          command: cd purchases-capacitor-ui && yarn build
      - run:
          name: Extract API (UI package)
          command: cd purchases-capacitor-ui && yarn extract-api
      - run:
          name: Check for API changes
          command: git diff --exit-code api-report/ purchases-capacitor-ui/api-report/

  # UI Package Jobs
  run-api-tests-ui:
    description: "Run API tests for purchases-capacitor-ui package"
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run: yarn build
      - run:
          name: API Tests (UI)
          command: cd purchases-capacitor-ui && yarn apitest

  run-lint-ui:
    description: "Run linting for purchases-capacitor-ui package"
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run: yarn build
      - run:
          name: Lint UI package
          command: cd purchases-capacitor-ui && yarn lint

  dry-run-release-ui:
    description: "Validate purchases-capacitor-ui package can be published"
    docker:
      - image: cimg/ruby:3.2.0
    steps:
      - checkout
      - revenuecat/install-gem-unix-dependencies:
          cache-version: v1
      - run:
          name: Temporarily bump version
          description: Running `npm publish --dry-run` for an existing version fails because the version is already published. This lane temporarily bumps the version to a next version just for testing the publish command.
          command: bundle exec fastlane temporary_bump_version
      - yarn-dependencies-unix
      - yarn-dependencies-ui-unix
      - run: yarn build
      - run:
          name: Build UI package
          command: cd purchases-capacitor-ui && yarn build
      - run:
          name: Dry run UI package release
          command: cd purchases-capacitor-ui && npm publish --dry-run

  make-release-ui:
    description: "Publishes the UI package to npm"
    <<: *base-mac-job
    steps:
      - checkout
      - revenuecat/install-gem-mac-dependencies:
          cache-version: v1
      - yarn-dependencies-mac
      - yarn-dependencies-ui-mac
      - revenuecat/trust-github-key
      - copy-npm-rc-ui
      - run:
          name: Release UI package
          command: bundle exec fastlane release_purchases_capacitor_ui

workflows:
  version: 2
  build-test-hold-deploy:
    when:
      not:
        equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
    jobs:
      # Testing phase - runs on all branches
      - run-api-tests
      - run-tests-ios
      - run-tests-android
      - run-lint
      - build-purchase-tester
      # AGP compatibility (issue #849): one job per AGP configuration
      - verify-android-agp8
      - verify-android-agp-override:
          name: verify-android-agp9
          agp_version: "9.2.1"
          gradle_version: "9.4.1"
      - verify-android-agp-override:
          name: verify-android-agp9-legacy-kotlin
          agp_version: "9.2.1"
          gradle_version: "9.4.1"
          extra_gradle_properties: "android.builtInKotlin=false"
      # API change detection
      - check-api-changes
      # UI Package jobs
      - run-api-tests-ui
      - run-lint-ui
      - dry-run-release-ui
      - run-maestro-e2e-tests-ios:
          context:
            - e2e-tests
      - run-maestro-e2e-tests-android:
          context:
            - e2e-tests

      # Hold and deploy phase - only on release branches
      - hold:
          type: approval
          requires:
            - run-api-tests
            - run-tests-ios
            - run-tests-android
            - run-lint
            - run-api-tests-ui
            - run-lint-ui
            - check-api-changes
            - verify-android-agp8
            - verify-android-agp9
            - verify-android-agp9-legacy-kotlin
          <<: *release-branches
      - revenuecat/tag-current-branch:
          requires:
            - hold
          <<: *release-branches
      - make-release:
          <<: *release-tags
      - make-release-ui:
          requires:
            - make-release
          <<: *release-tags
      - revenuecat/merge-release-pr:
          repo_name: purchases-capacitor
          requires:
            - make-release-ui
          <<: *release-tags

  danger:
    jobs:
      - revenuecat/danger

  weekly-run-workflow:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ "release-train", << pipeline.schedule.name >> ]
    jobs:
      - bump

  manual-trigger-bump:
    when:
      equal: [ bump, << pipeline.parameters.action >> ]
    jobs:
      - bump

  update-hybrid-common-versions:
    when:
      equal: [ upgrade-hybrid-common, << pipeline.parameters.action >> ]
    jobs:
      - update-hybrid-common-versions
